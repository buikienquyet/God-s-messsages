<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Chúa Mỗi Ngày</title>
    <style>
        body {
            margin: 0; padding: 0; 
            height: 100dvh; 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif; 
            overflow: hidden;
            background: #000;
        }

        /* Video nền tối ưu cho mobile và desktop */
        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover; 
            filter: brightness(0.4);
        }

        /* Card hiệu ứng kính mờ xuyên thấu */
        .card {
            text-align: center; 
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 85%; 
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }
        
        #quote { 
            font-size: 1.3rem; 
            line-height: 1.7; 
            margin-bottom: 1.5rem; 
            min-height: 150px; 
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #author { 
            color: rgba(255, 255, 255, 0.7); 
            display: block; 
            margin-bottom: 2.5rem; 
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        
        button { 
            width: 100%;
            padding: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active { 
            transform: scale(0.95); 
            background: white; 
            color: #000; 
        }

        @media (max-width: 480px) {
            #quote { font-size: 1.2rem; min-height: 120px; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Chỉ giữ lại Video Nền -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="card">
        <div id="quote">Đang nhận thông điệp...</div>
        <span id="author"></span>
        <button onclick="getRandomQuote()">Nhận Lời Chúa</button>
    </div>

    <script>
        // Danh sách 8 câu từ ảnh của bạn
        const quotes = [
            { text: "Hãy mạnh bạo và can đảm lên! Đừng sợ, đừng khiếp kinh, vì Đức Chúa, Thiên Chúa của ngươi, sẽ ở với ngươi bất cứ nơi nào ngươi đi tới.", author: "Giô-suê 1,9" },
            { text: "Đừng sợ, vì có Ta ở với con; đừng xao xuyến, vì Ta là Thiên Chúa của con. Ta cho con vững mạnh, Ta lại còn trợ giúp con, tay hữu xây thắng của Ta nâng đỡ con.", author: "I-sai-a 41,10" },
            { text: "Thầy để lại bình an cho anh em, Thầy ban cho anh em bình an của Thầy. Thầy ban cho anh em không theo kiểu thế gian. Anh em đừng xao xuyến cũng đừng sợ hãi.", author: "Gio-an 14,27" },
            { text: "Những người cậy trông Đức Chúa thì được thêm sức mạnh. Như thể chim bằng, họ cất cánh bay cao. Họ chạy hoài mà không mệt mỏi, đi mãi mà chẳng chồn chân.", author: "I-sai-a 40,31" },
            { text: "Chính Ta sẽ đi trước mặt ngươi, Ta sẽ ở với ngươi; Ta không bỏ mặc ngươi, Ta không bỏ rơi ngươi. Đừng sợ, đừng khiếp kinh!", author: "Đệ nhị luật 31,8" },
            { text: "Hãy ký thác đường đời cho Chúa, tin tưởng vào Người, Người sẽ ra tay.", author: "Thánh vịnh 37,5" },
            { text: "Mọi sự tôi đều có thể làm được trong Đấng ban sức mạnh cho tôi.", author: "Phi-líp-phê 4,13" },
            { text: "Đừng sợ, vì Ta đã chuộc con về, Ta đã gọi đích danh con, con là của riêng Ta. Con có băng qua nước, Ta sẽ ở cùng con; có vượt qua sông, cũng không bị nước cuốn; con có đi trong lửa, cũng không bị bỏng, ngọn lửa cũng chẳng thiêu chụi được con.", author: "I-sai-a 43,1-2" }
        ];

        function getRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            const item = quotes[index];
            
            // Hiệu ứng đổi chữ nhẹ nhàng
            const quoteEl = document.getElementById('quote');
            quoteEl.style.opacity = 0;
            
            setTimeout(() => {
                quoteEl.innerText = `"${item.text}"`;
                document.getElementById('author').innerText = `— ${item.author}`;
                quoteEl.style.opacity = 1;
            }, 200);
        }

        // Tự động hiện 1 câu khi vừa load trang
        window.onload = getRandomQuote;
    </script>
</body>
</html>

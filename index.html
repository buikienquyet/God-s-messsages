<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Chúa Mỗi Ngày</title>
    <style>
        body {
            margin: 0; padding: 0; 
            height: 100dvh; 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif; 
            overflow: hidden;
            background: #000;
        }

        /* Video nền tối ưu cho mobile và desktop */
        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover; 
            filter: brightness(0.4);
        }

        /* Card hiệu ứng kính mờ xuyên thấu */
        .card {
            text-align: center; 
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 85%; 
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }
        
        #quote { 
            font-size: 1.3rem; 
            line-height: 1.7; 
            margin-bottom: 1.5rem; 
            min-height: 150px; 
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #author { 
            color: rgba(255, 255, 255, 0.7); 
            display: block; 
            margin-bottom: 2.5rem; 
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        
        button { 
            width: 100%;
            padding: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active { 
            transform: scale(0.95); 
            background: white; 
            color: #000; 
        }

        @media (max-width: 480px) {
            #quote { font-size: 1.1rem; min-height: 120px; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="card">
        <div id="quote">Đang nhận thông điệp...</div>
        <span id="author"></span>
        <button onclick="getRandomQuote()">Nhận Lời Chúa</button>
    </div>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration</title>
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; font-family: 'Inter', system-ui, sans-serif; margin: 0; color: white; }
        .card { text-align: center; padding: 40px; background: #1e293b; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); max-width: 600px; border: 1px solid #334155; }
        #quote { font-size: 1.8rem; line-height: 1.4; margin-bottom: 25px; font-weight: 500; }
        #author { color: #94a3b8; font-size: 1.1rem; letter-spacing: 1px; }
        button { margin-top: 40px; padding: 12px 28px; border: none; background: #3b82f6; color: white; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div id="quote">Đang tải thông điệp...</div>
        <div id="author"></div>
        <button onclick="getRandomQuote()">Nhận thông điệp mới</button>
    </div>

    <script>
        const quotes = [
            { text: "Price is what you pay. Value is what you get.", author: "Warren Buffett" },
            { text: "The best way to predict the future is to create it.", author: "Peter Drucker" },
            { text: "Kỷ luật là cầu nối giữa mục tiêu và thành tựu.", author: "Jim Rohn" },
            { text: "Data is the new oil, but it's only useful if it's refined.", author: "Clive Humby" },
            { text: "Cách duy nhất để làm tốt một công việc là yêu nó.", author: "Steve Jobs" },
            { text: "Sự tử tế là ngôn ngữ mà người điếc có thể nghe và người mù có thể thấy.", author: "Mark Twain" }
        ];

        function getRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            const q = quotes[index];
            document.getElementById('quote').innerText = `"${q.text}"`;
            document.getElementById('author').innerText = `— ${q.author}`;
        }
        getRandomQuote();
    </script>
</body>
</html>

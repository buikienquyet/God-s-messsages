<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lời Chúa Mỗi Ngày</title>
    <style>
        body {
            margin: 0; padding: 0; 
            height: 100dvh; 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif; 
            overflow: hidden;
            background: #000;
        }

        /* Video nền tối ưu cho mobile và desktop */
        #bg-video {
            position: fixed; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover; 
            filter: brightness(0.4);
        }

        /* Card hiệu ứng kính mờ xuyên thấu */
        .card {
            text-align: center; 
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 85%; 
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }
        
        #quote { 
            font-size: 1.3rem; 
            line-height: 1.7; 
            margin-bottom: 1.5rem; 
            min-height: 150px; 
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #author { 
            color: rgba(255, 255, 255, 0.7); 
            display: block; 
            margin-bottom: 2.5rem; 
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        
        button { 
            width: 100%;
            padding: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        button:active { 
            transform: scale(0.95); 
            background: white; 
            color: #000; 
        }

        @media (max-width: 480px) {
            #quote { font-size: 1.1rem; min-height: 120px; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="card">
        <div id="quote">Đang nhận thông điệp...</div>
        <span id="author"></span>
        <button onclick="getRandomQuote()">Nhận Lời Chúa</button>
    </div>

    <script>
        // Danh sách 25 câu quote mới của bạn
        const quotes = [
            { text: "Hãy hành động ngay hôm nay sao cho ngày mai bạn không phải xấu hổ.", author: "Thánh John Bosco" },
            { text: "Hãy bắt đầu làm ngay từ bây giờ để trở thành người mà bạn muốn sẽ thành trong tương lai.", author: "Thánh Jerome" },
            { text: "Đức tin và sự tin tưởng vào Chúa có thể giúp chúng ta vượt qua ngay cả những hoàn cảnh khó khăn nhất.", author: "Thánh Peregrine Laziosi" },
            { text: "Không có gì là xa rời Thiên Chúa.", author: "Thánh Monica" },
            { text: "Hãy hành động và Chúa sẽ hành động.", author: "Thánh Jeanne d’Arc" },
            { text: "Một công trình kiến trúc tráng lệ sẽ không bao giờ mọc lên nếu chúng ta từ bỏ những viên gạch tầm thường.", author: "Thánh Faustina Kowalska" },
            { text: "Niềm vui là dấu hiệu chắc chắn nhất về sự hiện diện của Chúa.", author: "Thánh Theresa of Avila" },
            { text: "Chúa yêu thương mỗi người chúng ta như thể chỉ có một mình chúng ta.", author: "Thánh Augustine of Hippo" },
            { text: "Hãy căng buồm lên, và để Thiên Chúa dẫn dắt chúng ta đến nơi Ngài muốn.", author: "Thánh Bede the Venerable" },
            { text: "Nếu bạn có quá nhiều việc phải làm, với sự giúp đỡ của Chúa, bạn sẽ tìm được thời gian để hoàn thành tất cả.", author: "Thánh Peter Canisius" },
            { text: "Đừng sợ hãi: có Ta ở cùng con.", author: "Isaiah 41,10" },
            { text: "Ơn ta đủ cho con.", author: "2 Cr 12,9" },
            { text: "Mọi âu lo hãy trút cả cho Chúa vì người chăm sóc anh em.", author: "1 Pr 5,7" },
            { text: "Lòng nhân hậu và tình thương của Chúa ấp ủ con suốt đời.", author: "Tv 22:6" },
            { text: "Và tai bạn sẽ nghe được tiếng nói từ phía sau “ĐÂY LÀ ĐƯỜNG CỨ ĐI THEO ĐÓ”.", author: "Mt 7:7" },
            { text: "Này con, cứ yên tâm, lòng tin của con đã cứu chữa con.", author: "Mt 9:22" },
            { text: "Con là Con yêu dấu của Cha, Cha hài lòng về con.", author: "Mc 1:11" },
            { text: "Ta đã nghe lời con cầu nguyện và Ta đã thấy những giọt nước mắt của con… Này ta sẽ chữa lành con.", author: "2 V 20:5" },
            { text: "Hãy cứ ước mơ dù hiện tại đôi khi chẳng dễ dàng gì. Vì Thiên Chúa không tạo nên bạn để sống một cuộc đời chỉ biết cúi đầu trước giới hạn. Người đặt trong tim bạn những khát vọng, để bạn học cách tin vào ánh sáng ngay cả khi bạn đang đi qua những ngày tối nhất. Hãy can đảm mơ những điều lớn lao.", author: "Đức Thánh Cha Phanxico" },
            { text: "Nếu các con nhân danh Ta mà cầu xin Ta điều gì, thì Ta sẽ làm.", author: "Gioan 14:14" },
            { text: "Khi đúng thời điểm, Ta Thiên Chúa của con, sẽ làm điều đó diễn ra.", author: "Isaiah 60:22" },
            { text: "Hãy làm mọi việc bằng tình yêu thương.", author: "Corinto 16:14" },
            { text: "Tôi có thể làm tất cả nhờ Thiên Chúa, Đấng đã ban sức mạnh cho tôi.", author: "Phi-lip-phe 4:13" },
            { text: "Thiên Chúa ở cùng bạn, ai có thể đánh bại bạn?", author: "Roma 8:31" },
            { text: "Đừng sợ hãi, chỉ cần tin thôi.", author: "Mac-co 5:36" }
        ];

        function getRandomQuote() {
            const index = Math.floor(Math.random() * quotes.length);
            const item = quotes[index];
            
            const quoteEl = document.getElementById('quote');
            quoteEl.style.opacity = 0;
            
            setTimeout(() => {
                quoteEl.innerText = `"${item.text}"`;
                document.getElementById('author').innerText = `— ${item.author}`;
                quoteEl.style.opacity = 1;
            }, 200);
        }

        // Tự động hiện 1 câu ngẫu nhiên khi vừa vào web
        window.onload = getRandomQuote;
    </script>
</body>
</html>
